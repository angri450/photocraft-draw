[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photocraft-draw"
version = "0.1.0"
description = "用构图组件和绘制方案驱动 PhotoCraft 出图"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
photocraft-draw = "photocraft_draw.cli:main"

[tool.setuptools.packages.find]
include = ["photocraft_draw*"]
