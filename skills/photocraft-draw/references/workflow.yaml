schema: photocraft-draw-workflow/v2
name: "PhotoCraft-Draw 结构与画面交接"
policy:
  scope: "只负责画面意图、结构、白模和参考职责；模型选择、参数、上传与生图由 image-prompt 技能负责"
  principle: "够用就停，每步只解决当前最重要的问题"
  generation: "本工作树不产生任何生图请求"
  evidence: "结构、颜色、空间、视觉与实际出图各自独立记录"
decide_first:
  current_visual_goal: "观众在这张图里必须看见什么"
  geometry_required: "位置、遮挡、握持、咬合、碰撞、朝向是否有必须成立的关系"
  existing_change: "是否已有选定图片只改一个明确对象"
  main_problem: "本轮最先消除哪一个问题，哪些已经成立"
entry:
  - when: "只需文字判断"
    do: "写简短画面目标，不生成本地结构"
  - when: "已有图片，只改选定部位"
    do: "记录保留部分和变动对象，交接给 image-prompt"
  - when: "新画面且关系简单、允许自由构图"
    do: "直接写画面目标，跳过白模"
  - when: "只比较位置或排版"
    do: "quick 试稿，比较后停止或进入精确结构"
  - when: "要控制人物、道具或动物的精确关系"
    do: "写 plan，画正面白模"
geometry:
  plan:
    rule: "只写实际可见对象、几何和必要关系；优先查已有组件"
    command: "photocraft-draw verify {plan}"
  draft:
    command: "photocraft-draw draw {plan} --out-dir {out}"
  compared_actions:
    - when: "角色有明确施力或朝向"
      command: "photocraft-draw motion {plan}"
      other_command: "photocraft-draw facing {plan}"
    - when: "兵器实际相交或深度复杂"
      command: "photocraft-draw relations {plan} --json {report}"
      tolerance: "默认交叉深度差 24 像素；画面相交不等于空间相交"
    - when: "确有握持、咬合或重点遮挡"
      command: "photocraft-draw contact {whitebox_psd} --plan {plan}"
    - when: "仅凭正面图难以解释空间关系"
      command: "photocraft-draw views {plan} --out-dir {out}"
      restriction: "仅补充人物和兵器关系，不替代正面图"
  stop: "我要的关系成立就结束几何工作；颜色有骨模同色或有意同组时不要机械返工"
details:
  default: "画面目标简洁明确，不要求为每项说明配参考图"
  subjects: "仅记录有对象差异的身份、外形、服饰、道具、体态、材质、表情、构图、颜色、风格等可见要求"
  references:
    default: "正常只给必要的结构白模或造型参考；每张声明 targets、roles、instruction、avoid"
    one_many: "一张参考可承担多个职责"
    local_only: "全图中难以说明、又影响任务的关键局部才补局部参考"
    sources: "whitebox、character-sheet、palette、photo、other"
    note: "来源是交接中的职责标记，不是图片类型或模型的限定"
  commands:
    - "photocraft-draw brief {plan} --details --out-en {visual_brief}"
    - "photocraft-draw details {plan} --handoff {visual_handoff}"
  output:
    description: "场景和对象级画面要求，不重复整层画稿和流程标签"
    canvas: "画布像素"
    references: "已确认的真实路径、职责和排除项"
  roles_order: "保留参考列表顺序；不由模型模块自行编号"
handoff:
  target: "image-prompt"
  decision: "模型能力、所选模型参数、参考上传、一次请求、回执和成品下载都归 image-prompt"
  no_model_names: "photoCraft 文档、YAML 和代码不指定品牌"
  no_upload: "details 不写上传地址；visual_handoff 没有模型参数或请求字段"
review:
  each_round: "每轮只看当前主要问题；用一条回修记录说明修正对象与保留部分"
  identity_style: "只回对象级造型与风格参考"
  position_pose: "只回 plan 的关节、坐标或正面白模"
  local_contact: "只回局部对象；确有必要再补局部白模"
  colour_material: "只回对象颜色、材质和明暗说明"
  continuity: "共享身份和道具设定，保留各格自己的构图"
separate_tools:
  rule: "这些能力按需使用，均不进入生成主链"
  sheet: "用户要讲解手稿时才调用。仍是旧花枝专用版式，需要通用任务时另改参数"
  annotate: "用户要逐层确认时才调用；review JSON 按图层回改 plan"
  scene_layout: "prompt 只导出通用文字或 Layout 数据结构，不包含模型编译开关"
layout_export:
  default: "geometry 直接输出实际绘制层、部件和必要的人物或兵器结构"
  semantic: "对象属性、人物关节、兵器轴线、图层文字说明和真实存在的参考职责"
  components: "semantic 的数据之外，增加每层实际部件和范围"
  geometry: "用实际绘制层替换方案层次，深度和分段与绘制器使用同一个展开来源"
  coordinate_contract: "部件框夹在目标画布内，人物局部偏移与兵器深度保留在参考坐标像素中"
  evidence: "导出的是白模结构或参考职责，不是成品遵循结构的证明"
  examples:
    - "photocraft-draw prompt {plan} --detail semantic --out {layout}"
    - "photocraft-draw prompt {plan} --detail components --out {layout}"
    - "photocraft-draw prompt {plan} --detail geometry --out {layout}"
